[deepseek]
api_key = 你的key
base_url = https://api.deepseek.com
model = deepseek-chat

# 以下都是可选参数，不填就用默认值

# 发送给模型的历史字符上限，超过就从最早的一轮开始丢
max_history_chars = 40000

# 一次提问最多连续调几轮工具（防止模型死循环）
max_tool_rounds = 8

# 单次 readFile 最多返回多少字符
max_read_chars = 20000

# 打字机速度：每个字之间隔多少秒。0.03 ≈ 33 字/秒，看着像人在敲。
# 设 0 = 关掉打字机，回答一次全部出现。
# 注意它只是"最低速度"：模型吐字更快时会自动追帧，不会让回答在屏幕上
# 慢慢"回放"，所以调大它只会让**首屏**更慢，不会拖长整段显示时间。
type_delay = 0.03


# ---- 联网搜索（searchWe 工具）--------------------------------------
# 整段都可以不写：不配的话对话照常能用，只是 searchWe 会返回"没配置 Key"。
[search]
# 百度千帆 API Key：控制台 → API Key 管理 → 新建，形态类似 bce-v3/ALTAK-xxx/yyy
baidu_qianfan_api_key = 你的百度千帆key

# 出摘要用的模型（必须是这个账号已开通的）。
# 不填 = 只返回网页来源，没有摘要。
# 常见可选项：ernie-4.5-turbo-128k、ernie-4.0-8k；填错了接口会回 invalid_model。
model = ernie-4.5-turbo-128k

# 单次搜索超时（秒）
timeout = 30


# ---- 抓网页（FetchWeb 工具）----------------------------------------
# 同样可以不写：不配就用默认值。这一节唯一的用途是调"一篇网页占用多少上下文"。
[fetch]
# 单次抓取超时（秒）
timeout = 30

# 一篇网页最多返回多少字符。调小 = 省 token，但长文会被截断；
# 调大 = 看得全，但一次抓取就可能占满历史窗口。正文超过这个数会被切成
# "已截断"，模型看到提示后可以只抓别的页面补。
max_chars = 12000


# ---- 跑本地命令（RunCli 工具）--------------------------------------
# 同样可以不写。这一节管的是"一条命令能跑多久、能吐多少字回来"。
[cli]
# 单条命令的超时（秒）。到点会被强制结束，并把死之前吐出的输出交回来。
# 跑构建、装依赖这类慢命令时，模型可以在单次调用里临时把 timeout 调大（上限 600）。
timeout = 30

# stdout 和 stderr 各自最多返回多少字符。超了砍中间、留两头，
# 并在结果里写明"省略了多少字符"。
max_chars = 4000


# ---- MCP 远端工具（.mcp.json 里的外部 Server）----------------------
# 同样可以不写。Server 的连接信息不在 ini 里，而在启动目录的 .mcp.json；
# 这一节只管"等多久、返回多少字"。
[mcp]
# 建立连接 + initialize 握手的等待秒数。服务没启动时会在超时后明确报告。
connect_timeout = 10

# 单次 call_tool 的等待秒数。远端工具慢（查库、算数）时调大。
call_timeout = 60

# 远端工具返回最多保留多少字符。超了砍中间、留两头，和 FetchWeb 一个待遇。
max_chars = 8000

# 注册时给模型看的单条工具描述上限（太长的描述会截断）
desc_chars = 500


# ---- 上下文压缩（/compact 与上下文占用显示）------------------------
# 同样可以不写。不写 = 窗口按 128k 算，状态栏会标「默认」。
[context]
# 模型上下文窗口大小（tokens）。知道确切值就填，状态栏就不再显示「默认」。
# DeepSeek / 多数 GPT 兼容接口是 128000。
window = 128000

# 告警线：占用到这个比例就警告，并暂停接收新提问，直到 /compact 成功。
warn_ratio = 0.70

# 项目 AGENTS.md 注入会话时的字符上限（防止一份超长说明吃满首屏上下文）
agents_md_max_chars = 8000


# ---- 界面节奏（可选，一般不用动）------------------------------------
# 打字机、事件轮询这些纯显示参数。不写这个段 = 全部用默认值。
[ui]
# 事件队列轮询间隔（秒），0.04 ≈ 25fps
poll_interval = 0.04
# 模型吐字积压超过多少字开始追帧加速
fast_forward_chars = 40
# 追帧时每帧吃掉积压的几分之一
fast_forward_divisor = 5
# 收尾阶段每帧至少放几个字
drain_min_step = 3
# 收尾阶段每帧吃掉积压的几分之一
drain_divisor = 8
