[project]
name = "anythingllm-mcp"
version = "0.1.0"
description = "Stateless MCP server that exposes one local AnythingLLM workspace to AI clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anythingllm_mcp"]
